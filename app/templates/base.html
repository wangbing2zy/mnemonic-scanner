<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}助记词批量扫描工具{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid #2a2a4a;
        }
        .navbar-brand {
            color: #00d4aa !important;
            font-weight: 700;
            font-size: 1.3rem;
        }
        .card {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .card-header {
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid #2a2a4a;
            font-weight: 600;
        }
        .btn-primary {
            background: #00d4aa;
            border-color: #00d4aa;
            color: #0f0f1a;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #00b894;
            border-color: #00b894;
            color: #0f0f1a;
        }
        .btn-outline-light {
            border-color: #3a3a5a;
        }
        .btn-outline-light:hover {
            background: #2a2a4a;
            border-color: #4a4a6a;
        }
        .stat-card {
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
        }
        .progress {
            height: 10px;
            border-radius: 5px;
            background: #2a2a4a;
        }
        .progress-bar {
            background: linear-gradient(90deg, #00d4aa, #00b894);
            transition: width 0.5s ease;
        }
        .progress-bar.stage-2 {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        .badge-chain {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .badge-eth { background: #627eea; color: #fff; }
        .badge-bsc { background: #f0b90b; color: #1a1a2e; }
        .badge-btc { background: #f7931a; color: #1a1a2e; }
        .badge-sol { background: #9945ff; color: #fff; }
        .badge-trx { background: #ef0027; color: #fff; }
        .badge-polygon { background: #8247e5; color: #fff; }
        .badge-arbitrum { background: #2d374b; color: #fff; }
        .badge-optimism { background: #ff0420; color: #fff; }

        .table {
            color: #e0e0e0;
        }
        .table > :not(caption) > * > * {
            border-bottom-color: #2a2a4a;
        }
        .table-hover tbody tr:hover {
            background: rgba(0, 212, 170, 0.05);
        }
        .table-dark {
            --bs-table-bg: #1a1a2e;
        }
        .text-muted-light {
            color: #8888aa;
        }
        .upload-zone {
            border: 2px dashed #3a3a5a;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #00d4aa;
            background: rgba(0, 212, 170, 0.05);
        }
        .upload-zone .icon {
            font-size: 3rem;
            color: #00d4aa;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #555577;
            font-size: 0.85rem;
        }
        .chain-select-card {
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #2a2a4a;
        }
        .chain-select-card:hover {
            border-color: #4a4a6a;
        }
        .chain-select-card.selected {
            border-color: #00d4aa;
            background: rgba(0, 212, 170, 0.08);
        }
        a {
            color: #00d4aa;
        }
        a:hover {
            color: #00b894;
        }
        .pagination .page-link {
            background: #1a1a2e;
            border-color: #2a2a4a;
            color: #e0e0e0;
        }
        .pagination .page-link:hover {
            background: #2a2a4a;
        }
        .pagination .page-item.active .page-link {
            background: #00d4aa;
            border-color: #00d4aa;
            color: #0f0f1a;
        }
        .form-control, .form-select {
            background: #1a1a2e;
            border-color: #2a2a4a;
            color: #e0e0e0;
        }
        .form-control:focus, .form-select:focus {
            background: #1a1a2e;
            border-color: #00d4aa;
            color: #e0e0e0;
            box-shadow: 0 0 0 0.25rem rgba(0, 212, 170, 0.15);
        }
        .form-control::placeholder {
            color: #5555a0;
        }
        .alert-info {
            background: rgba(0, 212, 170, 0.1);
            border-color: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
        }
        .alert-danger {
            background: rgba(255, 0, 0, 0.1);
            border-color: rgba(255, 0, 0, 0.2);
        }
        .balance-positive {
            color: #00d4aa;
            font-weight: 600;
        }
        .copy-btn {
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .copy-btn:hover {
            opacity: 1;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .scanning-pulse {
            animation: pulse 1.5s infinite;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-search-heart me-2"></i>助记词扫描器
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="bi bi-speedometer2 me-1"></i>仪表盘
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/upload">
                            <i class="bi bi-upload me-1"></i>上传
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/results">
                            <i class="bi bi-wallet2 me-1"></i>结果
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="container">
            <i class="bi bi-shield-check me-1"></i>
            助记词批量扫描工具 v1.0 &mdash; 数据仅存储在本地服务器
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
